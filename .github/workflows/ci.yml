# Draait op elke PR en op main. Houdt tegen wat we anders pas in productie zien.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  controle:
    runs-on: ubuntu-latest

    # De rooktest heeft een echte database nodig — dezelfde majorversie als
    # productie, zodat migraties zich hier hetzelfde gedragen.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wingman
          POSTGRES_PASSWORD: wingman
          POSTGRES_DB: wingman
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wingman -d wingman"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # De app draait als app_user (geen BYPASSRLS), zodat CI het echte
      # gedrag test en niet de eigenaarsrol die overal langs mag.
      DATABASE_URL: postgresql://app_user:ci@localhost:5433/wingman
      DIRECT_URL: postgresql://wingman:wingman@localhost:5433/wingman
      AUTH_SECRET: ci-alleen-voor-tests
      RUNS_SECRET: ci-alleen-voor-tests
      # 32 bytes base64, alleen voor de pijplijn.
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SEED_PASSWORD: lokaal

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # Vóór de tests, niet erna: een deel van de suite bevraagt de database
      # zelf (tests/rls-dekking.test.ts controleert of elke tabel met user_id
      # afgeschermd is). Zonder migraties vindt die nul tabellen en faalt hij
      # om de verkeerde reden.
      - name: Database klaarzetten
        run: |
          PGPASSWORD=wingman psql -h localhost -p 5433 -U wingman -d wingman \
            -c "CREATE ROLE app_user WITH LOGIN PASSWORD 'ci';"
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - run: npx tsc --noEmit
      - run: npm test

      - name: Schermt row-level security echt af?
        run: node scripts/rls-bewijs.mjs

      - name: Bouwen en de poort controleren
        run: |
          npm run build
          npm start &
          npx wait-on http://localhost:3111/inloggen -t 60000
          npm run smoke
